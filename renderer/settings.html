<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Settings — Accela</title>
<style>
  body { font-family: 'Noto Sans', system-ui, sans-serif; background: #0d0d14; color: #fff; margin: 0; padding: 40px; }
  h1 { color: #ff2d95; font-size: 28px; margin-bottom: 8px; }
  .sub { color: #888; margin-bottom: 32px; }
  .section { background: #1c1c26; border: 1px solid #3a3a48; border-radius: 16px; padding: 24px; margin-bottom: 20px; max-width: 600px; }
  .section h2 { color: #00ffff; font-size: 18px; margin: 0 0 16px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #23232e; }
  .row:last-child { border: none; }
  select { background: #0d0d14; color: #fff; border: 1px solid #3a3a48; border-radius: 8px; padding: 10px; font-size: 14px; }
  .toggle { width: 48px; height: 26px; background: #3a3a48; border-radius: 13px; position: relative; cursor: pointer; border: none; }
  .toggle.on { background: #ff2d95; }
  .toggle::after { content: ''; position: absolute; width: 20px; height: 20px; background: #fff; border-radius: 50%; top: 3px; left: 3px; transition: left .2s; }
  .toggle.on::after { left: 25px; }
  .desc { color: #888; font-size: 13px; margin-top: 4px; }
</style></head>
<body>
  <h1>Settings</h1>
  <div class="sub">Accela</div>
  <div class="section">
    <h2>Search</h2>
    <div class="row">
      <div><div>Search engine</div><div class="desc">Used for address bar searches</div></div>
      <select id="se"></select>
    </div>
  </div>
  <div class="section">
    <h2>Appearance</h2>
    <div class="row">
      <div><div>Vertical tabs</div><div class="desc">Show tabs in a sidebar</div></div>
      <button class="toggle" id="vt"></button>
    </div>
  </div>
  <div class="section">
    <h2>Privacy</h2>
    <div class="row">
      <div><div>blackice adblocking</div><div class="desc">Block ads and trackers</div></div>
      <button class="toggle on" id="bi" disabled></button>
    </div>
  </div>
<script>
  // Populated via IPC from main process
  window.addEventListener('DOMContentLoaded', async () => {
    const s = await window.accelaSettings.get();
    const se = document.getElementById('se');
    for (const [id, e] of Object.entries(s.engines)) {
      const o = document.createElement('option');
      o.value = id; o.textContent = e.name;
      if (id === s.searchEngine) o.selected = true;
      se.appendChild(o);
    }
    se.addEventListener('change', () => window.accelaSettings.setEngine(se.value));
    const vt = document.getElementById('vt');
    vt.classList.toggle('on', s.verticalTabs);
    vt.addEventListener('click', async () => {
      const v = await window.accelaSettings.toggleVertical();
      vt.classList.toggle('on', v);
    });
  });
</script>
</body></html>
