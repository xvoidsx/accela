<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Accela</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="chrome">
  <!-- Tab strip -->
  <div id="tab-strip">
    <div id="tabs"></div>
    <button id="new-tab-btn" title="New tab">+</button>
  </div>
  <!-- Toolbar -->
  <div id="toolbar">
    <button id="back-btn" title="Back">←</button>
    <button id="forward-btn" title="Forward">→</button>
    <button id="reload-btn" title="Reload">⟳</button>
    <div id="shield" title="blackice active — ads & trackers blocked">🛡️</div>
    <input id="address-bar" type="text" placeholder="Search or enter address" spellcheck="false">
    <button id="go-btn" title="Go">→</button>
  </div>
</div>
<script src="renderer.js"></script>
</body>
</html>
